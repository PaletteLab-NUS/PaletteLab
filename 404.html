<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="refresh" content="0; url=/PaletteLab/" />
    <script>
      (function () {
        var redirectKey = "paletteLabRedirectPath";
        var path = window.location.pathname + window.location.search + window.location.hash;

        try {
          window.sessionStorage.setItem(redirectKey, path);
        } catch (error) {
          // If storage is unavailable, fall back to the app root.
        }

        window.location.replace("/PaletteLab/");
      })();
    </script>
    <title>Palette Lab</title>
  </head>
  <body>
    <p>Redirecting to Palette Lab...</p>
  </body>
</html>
